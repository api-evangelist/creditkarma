aid: creditkarma
name: CreditKarma
description: >-
  Credit Karma is a US personal-finance platform, a subsidiary of Intuit, that
  provides free credit scores and reports, ongoing credit and identity
  monitoring, and personalized recommendations for credit cards, loans, auto
  insurance, and other financial products, alongside Credit Karma Money banking
  and savings. It was surfaced as a portfolio company of 500 Global and added to
  the API Evangelist network. Credit Karma does not operate a public developer
  API program; this profile captures its public engineering, security, identity,
  and legal surface — a first-party open-source npm/GitHub org, an RFC 9116
  security.txt, and a HackerOne bug bounty program.
