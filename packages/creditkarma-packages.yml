notes: >-
  Credit Karma has no public consumer/product API and therefore ships no API
  client SDKs. It DOES maintain a first-party open-source engineering org on npm
  (@creditkarma) and GitHub (github.com/creditkarma) publishing backend
  infrastructure libraries (a NodeJS/TypeScript Thrift stack, dynamic config,
  Vault client, Zipkin tracing). These are official (author "Credit Karma") but
  are general engineering tooling, NOT SDKs for a Credit Karma API — so no
  `SDKs` rating pointer is emitted.
